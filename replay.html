<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiftPulse — Repetición (prueba sobre un VOD)</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e16;--s1:#121a2a;--s3:#0d1320;--line:#263352;--line2:#1b2439;--text:#e8edf7;--muted:#8b97b0;--blue:#4aa3ff;--blue2:#2f7fe0;--ok:#3ddc97;--ffd:'Chakra Petch',system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 32% 26%,#17301f 0,rgba(23,48,31,0) 55%),radial-gradient(1000px 650px at 80% 74%,#2a1630 0,rgba(42,22,48,0) 55%),linear-gradient(135deg,#0c1510,#0e1622 55%,#150f18);
    color:var(--text);font:400 14px/1.5 'Inter',system-ui,sans-serif;min-height:100%}
  .hint{position:fixed;top:14px;left:14px;font-size:12px;color:#8b97b0;background:rgba(8,11,18,.7);border:1px solid var(--line2);border-radius:8px;padding:7px 11px;max-width:320px}
  .panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:linear-gradient(180deg,rgba(18,26,42,.96),rgba(11,16,26,.97));border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:10;max-width:94vw}
  .panel .ttl{display:flex;align-items:center;gap:8px;font-family:var(--ffd);font-size:13px;font-weight:700;letter-spacing:.4px;margin-right:4px}
  .panel img{width:22px;height:22px}
  label{font-size:12px;color:var(--muted)}
  select,input{background:var(--s3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
  select{max-width:260px}
  input[type=number]{width:62px}
  button{font-family:var(--ffd);font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--s1);color:var(--text);border-radius:9px;padding:8px 14px;cursor:pointer}
  button.play{background:linear-gradient(180deg,var(--blue),var(--blue2));border-color:var(--blue);color:#06121f}
  button:hover{border-color:var(--blue)}
  .msg{font-size:12px;color:var(--ok);min-width:60px}
</style>
</head>
<body>
  <div class="hint" id="hint">Cargando partidos de Worlds ya jugados…<br>Elige uno abajo y pulsa <b>Reproducir</b>. El overlay revivirá esa partida acelerada, como si fuera en vivo.</div>

  <div class="panel">
    <div class="ttl"><img src="logo.svg" alt="">Repetición</div>
    <label>Partido <select id="game"><option>cargando…</option></select></label>
    <label>Juego <input type="number" id="juego" value="1" min="1" max="5"></label>
    <label>Desde min <input type="number" id="min" value="8" min="0" max="60"></label>
    <label>Velocidad
      <select id="vel"><option value="4">×4</option><option value="8" selected>×8</option><option value="16">×16</option><option value="30">×30</option></select>
    </label>
    <button class="play" id="play">▶ Reproducir</button>
    <span class="msg" id="msg"></span>
  </div>

<script>window.RP_NO_AUTOSTART = true;</script>
<script src="engine.js"></script>
<script src="overlay.js"></script>
<script>
  var R = window.RiftEngine, sel = document.getElementById('game'), msg = document.getElementById('msg'), hint = document.getElementById('hint');
  function say(t, ok){ msg.textContent = t; msg.style.color = ok===false ? '#ff8a8f' : '#3ddc97'; }
  (async () => {
    try {
      var games = await R.recentGames();
      if (!games.length) { sel.innerHTML = '<option>sin partidos recientes</option>'; hint.innerHTML = 'No encontré partidos de Worlds ya jugados en el calendario.'; return; }
      sel.innerHTML = games.map(function(g){ var d = new Date(g.date); var f = d.toLocaleDateString('es',{day:'2-digit',month:'short'});
        return '<option value="'+g.id+'">'+g.blue+' vs '+g.red+' · '+f+(g.block?' · '+g.block:'')+'</option>'; }).join('');
      hint.innerHTML = 'Elige un partido y pulsa <b>Reproducir</b>. El overlay revivirá esa partida acelerada, arriba al centro. Arrástralo o cambia su posición con el chip ↑↓.';
    } catch (e) { sel.innerHTML = '<option>error al cargar</option>'; hint.textContent = 'No se pudo cargar el calendario: ' + e.message; }
  })();
  document.getElementById('play').addEventListener('click', async function(){
    var id = sel.value; if (!id || id.length < 5) return;
    say('cargando la partida…');
    try { await R.replay(id, +document.getElementById('juego').value||1, +document.getElementById('min').value||8, +document.getElementById('vel').value||8); say('▶ reproduciendo'); }
    catch (e) { say('error: ' + e.message, false); }
  });
</script>
</body>
</html>
