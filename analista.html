<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiftPulse — Mesa de análisis</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--s1:var(--g1);--s2:var(--g2);--s3:var(--g1);--red2:var(--team-b-2)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 520px at 12% -10%,var(--g1) 0,rgba(var(--g1-rgb),0) 60%),radial-gradient(900px 420px at 95% -8%,var(--g1) 0,rgba(var(--g1-rgb),0) 55%),var(--bg);
    color:var(--text);font:400 15px/1.5 var(--ff);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 20px 50px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .top img{width:34px;height:34px}
  .top h1{font-family:var(--ffd);font-size:18px;margin:0;letter-spacing:.5px}
  .top .sub{color:var(--muted);font-size:12px}
  .live{margin-left:auto;font-family:var(--ffd);font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--live);background:#2a0d12;border:1px solid #7a1f26;border-radius:99px;padding:5px 12px}
  .fdst{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.35}.fdst b{color:var(--text)}.fdst .warn{color:var(--signal)}.fdst .down{color:var(--live)}
  .cmpb{background:rgba(var(--g1-rgb),.8);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px 12px;font:600 12px Inter Tight,sans-serif;cursor:pointer}.cmpb.on{background:linear-gradient(180deg,var(--gold-soft,var(--signal-soft)),var(--gold-2,var(--signal-2)));color:var(--g0)}
  .tk{display:flex;gap:10px;align-items:flex-start}.tk>span{flex:1}.tkc{flex:none;background:rgba(var(--g1-rgb),.8);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer}.tkc.ok{color:var(--ok);border-color:var(--ok)}
  .live.off{color:var(--muted);background:var(--s3);border-color:var(--line2)}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--g1),var(--g1));border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  h2{font-family:var(--ffd);font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--blue2));box-shadow:0 0 8px rgba(var(--team-a-rgb),.4)}
  /* marcador + probabilidad */
  .sc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sc .tc{font-family:var(--ffd);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .sc .tc.b{color:var(--team-a-txt)}.sc .tc.r{color:var(--team-b-txt)}
  .sc .vs{font-family:var(--ffd);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bigp{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
  .bigp .n{font-family:var(--ffd);font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .bigp .who{font-size:16px;color:var(--muted)}
  .pbar{display:flex;height:34px;border-radius:9px;overflow:hidden;font-family:var(--ffd);font-weight:700;font-size:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .pbar .pb{display:flex;align-items:center;padding:0 12px;color:var(--team-a-ink);background:linear-gradient(180deg,var(--team-a),var(--team-a-2));transition:width .7s cubic-bezier(.4,0,.2,1)}
  .pbar .pr{display:flex;align-items:center;justify-content:flex-end;padding:0 12px;color:#fff;background:linear-gradient(180deg,var(--team-b),var(--team-b-2));transition:width .7s cubic-bezier(.4,0,.2,1)}
  .delta{font-size:12.5px;color:var(--muted);margin-top:8px}
  .delta b{color:var(--text)}
  /* razones */
  .rz{list-style:none;margin:0;padding:0}
  .rz li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
  .rz li:first-child{border-top:0}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.b{background:var(--blue);box-shadow:0 0 8px rgba(var(--team-a-rgb),.5)}.dot.r{background:var(--red);box-shadow:0 0 8px rgba(var(--team-b-rgb),.5)}
  .rz .w{margin-left:auto;font-family:var(--ffd);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
  /* momentum */
  .spark{width:100%;height:84px;display:block}
  .spk-note{font-size:12px;color:var(--muted);margin-top:4px}
  /* timers / eventos */
  .tms{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .tm{background:var(--s3);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;text-align:center;min-width:92px}
  .tm .v{font-family:var(--ffd);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .tm .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .ev{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto}
  .ev li{font-size:13px;padding:4px 0;border-top:1px solid var(--line2);color:var(--text)}
  .ev .t{color:var(--muted);font-variant-numeric:tabular-nums;display:inline-block;width:42px}
  /* puntos para comentar */
  .talk,.wide{grid-column:1 / -1}
  .tk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);font-size:15px;line-height:1.45}
  .tk:first-child{border-top:0}
  .tk .b{color:var(--gold);font-weight:800;flex:none;font-family:var(--ffd)}
  .empty{color:var(--muted);text-align:center;padding:24px 0}
  .b{color:var(--team-a-txt)}.r{color:var(--team-b-txt)}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  /* giros clave */
  .sw{list-style:none;margin:8px 0 0;padding:0}
  .sw li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line2);font-size:13px;color:var(--text)}
  .sw li:first-child{border-top:0}
  .sw .t{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
  .sw .d{font-family:var(--ffd);font-weight:700;flex:none;width:62px}
  /* serie */
  .sr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .sr .bx{background:var(--s3);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
  .sr .v{font-family:var(--ffd);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .sr .k{font-size:12px;color:var(--muted)}
  .h2h{font-size:13px;color:var(--text)}.h2h .l{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  /* remontada */
  .cb{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:14px}
  .cb:first-of-type{border-top:0}
  .cb .p{margin-left:auto;font-family:var(--ffd);font-weight:700;font-variant-numeric:tabular-nums}
  /* duelos */
  .ln{width:100%;border-collapse:collapse;font-size:13px}
  .ln td{padding:6px 4px;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
  .ln tr:first-child td{border-top:0}
  .ln .rl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;width:58px}
  .ln .pn{font-weight:600}.ln .ch{color:var(--muted);font-size:12px;display:block}
  .ln .df{text-align:center;font-family:var(--ffd);font-weight:700;width:120px}
  .ln .df small{display:block;font-family:var(--ff);font-weight:400;color:var(--muted);font-size:12px}
  /* la historia del juego, qué cambió y qué mirar */
  .hist{margin:0;padding:0;list-style:none;counter-reset:h}
  .hist li{position:relative;padding:8px 0 8px 30px;border-top:1px solid var(--line2);font-size:16px;line-height:1.5}
  .hist li:first-child{border-top:0}
  .hist li::before{counter-increment:h;content:counter(h);position:absolute;left:0;top:10px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--ffm);color:var(--signal-ink);background:var(--signal)}
  .chg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chg span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--g2);border:1px solid var(--line)}
  .chg span.b{border-color:rgba(var(--team-a-rgb),.55)}.chg span.r{border-color:rgba(var(--team-b-rgb),.55)}
  .chg span i{font-style:normal;font-family:var(--ffd);font-weight:800;font-size:14px}
  .big2{font-family:var(--ffd);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
  .mir{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;font-size:14px}
  .mir .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
  .jg{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .jg td{padding:6px 4px;border-top:1px solid var(--line2)}.jg tr:first-child td{border-top:0}
  .jg td:first-child{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .jg td.v{text-align:center;font-family:var(--ffd);font-weight:700;font-size:16px;width:90px}
  .pico{font-size:13px;padding:5px 0;border-top:1px solid var(--line2)}.pico:first-of-type{border-top:0}.pico .t{color:var(--muted);font-family:var(--ffm);font-size:12px;margin-right:6px}
  .ln .rt{text-align:right}
  .kp{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(var(--signal-rgb),.08);border:1px solid rgba(var(--signal-rgb),.3);font-size:13.5px}
  .kp b.g{color:var(--gold)}
  /* draft */
  .dr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dr .ch{font-size:12.5px;color:var(--text);line-height:1.7}
  .dr .pl{font-size:12.5px;color:var(--muted);margin-top:6px}.dr .pl b{color:var(--text)}
  .win{margin-top:10px;font-size:13.5px;padding:9px 12px;background:var(--s3);border:1px solid var(--line2);border-radius:10px}
  /* mapa de la grieta */
  .rift{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.rift{grid-template-columns:1fr}}
  .rift svg{width:100%;height:auto;display:block}
  .rift .pt,.rift [data-pt]{cursor:pointer}
  .rift .pt circle.r{transition:r .2s}
  .rift .pt:hover circle.r,.rift .pt.on circle.r{stroke:var(--signal);stroke-width:1.2}
  .rift .pls{animation:rpp 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes rpp{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
  .rdt h3{font-family:var(--ffd,var(--ff));font-size:16px;letter-spacing:1.6px;text-transform:uppercase;margin:0 0 8px}
  .rdt .ln{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line2);font-size:13.5px}
  .rdt .ln:first-of-type{border-top:0}
  .rdt .t{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rdt .kv{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
  .rdt .kv span{background:var(--s3);border:1px solid var(--line2);border-radius:6px;padding:4px 9px;font-size:12.5px}
  /* gráficos */
  .chart{width:100%;display:block}
  .lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .pf{width:100%;border-collapse:collapse;font-size:12.5px}
  .pf td{padding:4px 5px;border-top:1px solid var(--line2);vertical-align:middle}
  .pf tr.sep td{border-top:2px solid var(--line)}
  .pf .ch{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .pf .ch img{width:24px;height:24px;border-radius:4px}
  .pf .bar{height:7px;border-radius:2px;background:rgba(var(--line-rgb),0.066);overflow:hidden;min-width:60px}
  .pf .bar i{display:block;height:100%}
  .pf .n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  /* alineaciones de la serie */
  .maps{display:grid;gap:12px}
  .mp{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
  .mp:first-child{border-top:0}
  @media(max-width:700px){.mp{grid-template-columns:1fr}}
  .mp .h b{display:block;font-family:var(--ffd,var(--ff));font-size:15px;letter-spacing:1.4px;text-transform:uppercase}
  .mp .h span{font-size:12px;color:var(--muted)}
  .mp .lu{display:flex;align-items:center;gap:6px;margin:3px 0}
  .mp .lu .c{width:46px;font-family:var(--ffd,var(--ff));font-weight:700;letter-spacing:1px}
  .mp .lu img{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);display:block}
  .mp .lu .ph{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--s3);font-size:9px;color:var(--muted);overflow:hidden;text-align:center;line-height:1.05}
  .mp .lu.w img{border-color:rgba(61,220,151,.6)}
  .mp .lu.l{opacity:.55}
  .mp .lu .wn{font-size:11px;color:var(--ok);letter-spacing:1px;text-transform:uppercase}
  /* resumen post-juego */
  .rc{grid-column:1 / -1;border-color:rgba(var(--signal-rgb),.45)}
  .rc .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rc .ttl{font-family:var(--ffd);font-size:24px;font-weight:700}
  .rc .btn{margin-left:auto;font:700 13px var(--ffd);color:var(--team-a-ink);background:linear-gradient(180deg,var(--signal),var(--signal-2));border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
  .rc ul{margin:10px 0 0;padding-left:18px;font-size:14.5px;line-height:1.7}
  footer{margin-top:18px;color:var(--muted);font-size:11.5px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--ffd);font-size:12px;color:var(--ok);font-weight:700}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(61,220,151,.6)}
</style>

<body>
<div class="wrap">
  <div class="top">
    <img src="logo.svg" alt="RiftPulse">
    <div><h1>Mesa de análisis</h1><div class="sub">RiftPulse · pronóstico en vivo para comentar el Mundial</div></div>
    <span class="fdst" id="fdst"></span>
    <button class="cmpb" id="cmpb" title="Solo lo esencial para comentar en vivo">Modo compacto</button>
    <span class="live off" id="live" style="margin-left:0">SIN PARTIDO</span>
  </div>

  <div id="content"><div class="card"><div class="empty">Buscando un partido del Mundial en vivo… <a href="analista.html?demo" style="color:var(--link)">Ver una demo con un partido ya jugado</a></div></div></div>

  <footer>
    <span class="pill" id="precPill">—</span> · Herramienta de pronóstico y análisis, sin fines de apuestas. No está avalada por Riot Games. Hecho por VectisDev. · <a href="como-funciona.html" target="_blank" rel="noopener" style="color:var(--link)">Cómo funciona</a>
  </footer>
</div>

<script src="engine.js"></script>
<script src="rp-ui.js"></script>
<script>
(function () {
  'use strict';
  var R = window.RiftEngine;
  var content = document.getElementById('content'), liveEl = document.getElementById('live'), precPill = document.getElementById('precPill');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

  var pct=function(x){ return Math.round(x*100)+'%'; };
  var k1=function(g){ return (Math.abs(g)/1000).toFixed(1).replace('.',',')+'k'; };
  var sc=function(side){ return side==='blue'?'b':'r'; };

  function historiaCard(s){
    var h=R.historia?R.historia(s):[];
    return h.length?'<ol class="hist">'+h.map(function(x){ return '<li>'+x.html+'</li>'; }).join('')+'</ol>':'<div class="empty">Se escribe sola a medida que avanza el juego (desde el min 7).</div>';
  }
  function cambioCard(s){
    var c=R.cambio?R.cambio(s):null, m=s.match;
    if (!c) return '<div class="empty">Aparece después del primer minuto de juego.</div>';
    var lado=c.dp>=0?'blue':'red';
    return '<div style="display:flex;align-items:baseline;gap:10px"><span class="big2 '+sc(lado)+'">'+(c.dp?(lado==='blue'?m.blue.code:m.red.code)+' +'+Math.abs(c.dp):'±0')+'</span><span class="delta" style="margin:0">puntos de probabilidad desde el min '+mmss(c.desde)+'</span></div>'+
      (c.items.length?'<div class="chg" style="margin-top:10px">'+c.items.map(function(x){ return '<span class="'+sc(x.side)+'"><i class="'+sc(x.side)+'">'+esc(x.code)+'</i>'+esc(x.txt)+'</span>'; }).join('')+'</div>':'<div class="delta">Sin cambios en el mapa: el modelo se mueve solo por el reloj.</div>');
  }
  function mirarCard(s){
    var o=R.mirar?R.mirar(s):null, m=s.match;
    if (!o) return '<div class="empty">Sin objetivos grandes a la vista.</div>';
    var h='<div class="mir"><span class="k">Próximo</span><span><b>'+esc(o.obj)+'</b> '+(o.vivo?'<b>ya está en el mapa</b>':'en <b>'+mmss(o.en)+'</b>')+'</span>';
    if (o.impacto) h+='<span class="k">Mueve</span><span>si lo toma <b class="b">'+esc(m.blue.code)+'</b> '+(o.impacto.blue>=0?'+':'')+o.impacto.blue+' pts · si lo toma <b class="r">'+esc(m.red.code)+'</b> '+(o.impacto.red>=0?'+':'')+o.impacto.red+' pts</span>';
    h+='<span class="k">Llega mejor</span><span>'+(o.mejor?'<b class="'+sc(o.mejor)+'">'+esc(o.code)+'</b>: '+o.por.map(function(x){ return esc(x.txt); }).join(' y '):'parejo')+'</span></div>';
    return h;
  }
  function jugCard(s){
    var J=s.game.jugadores, m=s.match;
    if (!J) return '<div class="empty">Llega con los datos de los jugadores.</div>';
    var f=function(a,b,fmt){ var x=a>b?'b':a<b?'r':''; return '<td class="v'+(x==='b'?' b':'')+'">'+fmt(a)+'</td><td class="v'+(x==='r'?' r':'')+'">'+fmt(b)+'</td>'; };
    var dec=function(v){ return v.toFixed(1).replace('.',','); }, ent=function(v){ return String(v); };
    var rows='<tr><td></td><td class="v b">'+esc(m.blue.code)+'</td><td class="v r">'+esc(m.red.code)+'</td></tr>'+
      '<tr><td>Nivel medio</td>'+f(J.blue.lvl,J.red.lvl,dec)+'</tr>'+
      '<tr><td>Con nivel 6 / 11 / 16</td><td class="v">'+J.blue.n6+' / '+J.blue.n11+' / '+J.blue.n16+'</td><td class="v">'+J.red.n6+' / '+J.red.n11+' / '+J.red.n16+'</td></tr>';
    if (J.items) rows+='<tr><td>Ítems completos</td>'+f(J.blue.items,J.red.items,ent)+'</tr>';
    if (J.wards) rows+='<tr><td>Wards puestas</td>'+f(J.blue.wp,J.red.wp,ent)+'</tr><tr><td>Wards destruidas</td>'+f(J.blue.wd,J.red.wd,ent)+'</tr>';
    var pk=(J.picos||[]).slice().reverse().slice(0,4).map(function(p){ return '<div class="pico"><span class="t">'+mmss(p.gt)+'</span><b class="'+sc(p.side)+'">'+esc(p.name)+'</b> ('+esc(p.champ)+') completó <b>'+esc(p.item)+'</b> · '+p.n+'.º ítem</div>'; }).join('');

    var mk=(g.events||[]).filter(function(e){ return ['dragon','elder','baron','inhib'].indexOf(e.kind)>=0; }).map(function(e){
      var c=e.side==='blue'?RPC.a:RPC.b, ic={dragon:'D',elder:'A',baron:'B',inhib:'I'}[e.kind], y=e.side==='blue'?10:H-10;
      return '<g><line x1="'+X(e.gt)+'" x2="'+X(e.gt)+'" y1="'+(e.side==='blue'?16:H/2)+'" y2="'+(e.side==='blue'?H/2:H-16)+'" stroke="'+c+'" stroke-dasharray="2 3" opacity=".5"/><circle cx="'+X(e.gt)+'" cy="'+y+'" r="7" fill="'+c+'"/><text x="'+X(e.gt)+'" y="'+(y+3.2)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+RPC.aink+'">'+ic+'</text><title>'+mmss(e.gt)+' · '+esc(e.txt)+'</title></g>'; }).join('');
    var ticks=[]; for(var t=0;t<=t1;t+=300) ticks.push('<text x="'+X(t)+'" y="'+(H-1)+'" font-size="9" fill="#6e7686" text-anchor="middle">'+(t/60)+'\'</text>');
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+RPC.a+'" stop-opacity=".55"/><stop offset=".5" stop-color="'+RPC.a+'" stop-opacity=".05"/><stop offset=".5" stop-color="'+RPC.b+'" stop-opacity=".05"/><stop offset="1" stop-color="'+RPC.b+'" stop-opacity=".55"/></linearGradient></defs>'+
      '<line x1="'+P+'" x2="'+W+'" y1="'+Y(0)+'" y2="'+Y(0)+'" style="stroke:var(--line-strong)"/><text x="2" y="'+(Y(mx)+4)+'" font-size="9" fill="#6e7686">+'+k1(mx)+'</text><text x="2" y="'+(Y(-mx)+4)+'" font-size="9" fill="#6e7686">+'+k1(mx)+'</text>'+
      '<path d="'+area+'" fill="url(#gg)"/><polyline points="'+line+'" fill="none" style="stroke:var(--text)" stroke-width="1.6"/>'+mk+ticks.join('')+'</svg>'+
      '<div class="lg"><span><i style="background:var(--team-a)"></i>arriba: ventaja de '+esc(s.match.blue.code)+'</span><span><i style="background:var(--team-b)"></i>abajo: ventaja de '+esc(s.match.red.code)+'</span><span>D dragón · A ancestral · B Barón · I inhibidor</span></div>';
  }
  function killsChart(s){
    var sm=(s.game.samples||[]).filter(function(x){ return x.kb!=null; }); if(sm.length<2) return '<div class="note">Se dibuja conforme avanza el juego…</div>';
    var W=600,H=150,P=22, t1=Math.max(60,sm[sm.length-1].gt), mx=Math.max(5,Math.max.apply(null,sm.map(function(x){ return Math.max(x.kb,x.kr); })));
    var X=function(t){ return P+t/t1*(W-P-6); }, Y=function(v){ return H-14-v/mx*(H-26); };
    var step=function(k){ var d='M'+X(sm[0].gt)+','+Y(sm[0][k]); for(var i=1;i<sm.length;i++) d+=' L'+X(sm[i].gt)+','+Y(sm[i-1][k])+' L'+X(sm[i].gt)+','+Y(sm[i][k]); return d; };
    var last=sm[sm.length-1];
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><line x1="'+P+'" x2="'+W+'" y1="'+Y(0)+'" y2="'+Y(0)+'" style="stroke:var(--line-strong)"/>'+
      '<path d="'+step('kb')+'" fill="none" stroke="'+RPC.a+'" stroke-width="2"/><path d="'+step('kr')+'" fill="none" stroke="'+RPC.b+'" stroke-width="2"/>'+
      '<text x="'+(W-4)+'" y="'+(Y(last.kb)-4)+'" text-anchor="end" font-size="11" font-weight="700" fill="'+RPC.a+'">'+last.kb+'</text><text x="'+(W-4)+'" y="'+(Y(last.kr)+12)+'" text-anchor="end" font-size="11" font-weight="700" fill="'+RPC.b+'">'+last.kr+'</text></svg>'+
      '<div class="lg"><span><i style="background:var(--team-a)"></i>'+esc(s.match.blue.code)+'</span><span><i style="background:var(--team-b)"></i>'+esc(s.match.red.code)+'</span></div>';
  }
  function perfCard(s){
    var L=s.game.lanes, gt=Math.max(60,s.game.gt);
    if(!L||!L.length) return '<div class="note">Aparece cuando llega el feed de detalles de los jugadores.</div>';
    var all=[]; L.forEach(function(l){ all.push(l.blue,l.red); });
    var mxS=Math.max.apply(null,all.map(function(p){ return p.share||0; }))||1, mxG=Math.max.apply(null,all.map(function(p){ return p.gold||0; }))||1;
    var row=function(p,side){ var c=side==='blue'?RPC.a:RPC.b;
      return '<tr><td><div class="ch">'+champImg(p.champId)+'<span class="'+sc(side)+'">'+esc(p.name)+'</span></div></td>'+
        '<td style="width:30%"><div class="bar"><i style="width:'+Math.round((p.share||0)/mxS*100)+'%;background:'+c+'"></i></div></td><td class="n">'+Math.round((p.share||0)*100)+'%</td>'+
        '<td style="width:22%"><div class="bar"><i style="width:'+Math.round((p.gold||0)/mxG*100)+'%;background:var(--signal)"></i></div></td><td class="n">'+k1(p.gold||0)+'</td>'+
        '<td class="n">'+((p.cs||0)/(gt/60)).toFixed(1)+'</td></tr>'; };
    return '<table class="pf"><tr><td></td><td colspan="2" class="note" style="border:0">% del daño del equipo</td><td colspan="2" class="note" style="border:0">oro</td><td class="note n" style="border:0">CS/min</td></tr>'+
      L.map(function(l){ return row(l.blue,'blue'); }).join('')+'<tr class="sep"><td colspan="6"></td></tr>'+L.map(function(l){ return row(l.red,'red'); }).join('')+'</table>';
  }
  function mapsCard(s){
    var mp=s.maps;
    if(!mp||!mp.length) return '<div class="note">Aparece cuando la serie tiene juegos jugados o en curso.</div>';
    return '<div class="maps">'+mp.map(function(x){
      if(x.loading||!x.blue) return '<div class="mp"><div class="h"><b>Mapa '+x.n+'</b><span>cargando…</span></div><div></div></div>';
      var team=function(side){ var t=x[side], w=x.winner?(x.winner===t.code?' w':' l'):'';
        return '<div class="lu'+w+'"><span class="c '+sc(side)+'">'+esc(t.code)+'</span>'+t.picks.map(function(p){ return '<span title="'+esc(p.name+' · '+p.champ)+'">'+(champImg(p.champId)||'<span class="ph">'+esc(p.champ.slice(0,7))+'</span>')+'</span>'; }).join('')+(x.winner===t.code?'<span class="wn">gana</span>':'')+'</div>'; };
      return '<div class="mp"><div class="h"><b>Mapa '+x.n+'</b><span>'+(x.state==='inProgress'?'en curso':x.winner?esc(x.winner)+' gana'+(x.dur?' · '+mmss(x.dur):''):'')+'</span></div><div>'+team('blue')+team('red')+'</div></div>';
    }).join('')+'</div><div class="note">Azul arriba, rojo abajo. El feed oficial no trae los bloqueos (bans): solo las selecciones.</div>';
  }

  function recapCard(s){
    var m=s.match, r=s.game.recap;
    return '<div class="card rc"><div class="hd"><span class="ttl '+sc(r.win)+'">'+esc(r.code)+' gana el juego'+(m.gameNo?' '+m.gameNo:'')+'</span><span class="vs">vs '+esc(r.lose)+'</span>'+
      '<button class="btn" data-act="png">⬇ Descargar imagen</button></div><ul>'+recapLines(s).map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>';
  }
  // Imagen 1200×675 del resumen, para redes (dibujada en canvas, sin librerías).


  function render(s){
    // precisión al pie (siempre)
    if (s.precision) precPill.textContent = s.precision.acc15*100|0 ? Math.round(s.precision.acc15*100)+'% de acierto al min 15 ('+s.precision.juegos+' juegos de prueba)' : '—';

    var f=s.feed||{}, fdEl=document.getElementById('fdst');
    fdEl.innerHTML='Datos: <b class="'+(f.estado==='caido'?'down':f.estado==='retrasado'||f.estado==='pausa'?'warn':'')+'">'+esc(f.txt||'—')+'</b><br>Retraso aplicado: <b>'+(s.follow||s.demo?'—':R.delay+' s')+'</b>';
    if (!s.match){ liveEl.textContent='SIN PARTIDO'; liveEl.className='live off';
      content.innerHTML='<div class="card"><div class="empty">No hay un partido del Mundial en vivo ahora. <a href="analista.html?demo" style="color:var(--link)">Ver una demo con un partido ya jugado</a></div></div>'; return; }
    var m=s.match, g=s.game;
    if (window.RPUI){ RPUI.colores(m.blue.code, m.red.code); if (m.blue.img) RPUI.colorDeLogo(m.blue.code, m.blue.img); if (m.red.img) RPUI.colorDeLogo(m.red.code, m.red.img); }

    if (!g || g.pBlue==null){
      liveEl.textContent = (g&&g.waiting)?'EN JUEGO (cargando)':'PREVIA'; liveEl.className='live';
      content.innerHTML='<div class="card"><div class="sc"><span class="tc b">'+esc(m.blue.code)+'</span><span class="vs">vs</span><span class="tc r">'+esc(m.red.code)+'</span></div>'+
        '<div class="empty">'+((g&&g.waiting)?'Esperando datos del juego…':'La partida está por empezar. Apenas lleguen los datos, aparece el pronóstico en vivo.')+'</div></div>';
      return;
    }

    liveEl.textContent=s.demo?'DEMO · partido real del '+s.demo.date.slice(8,10)+'/'+s.demo.date.slice(5,7)+' · ×'+s.demo.vel+(g.ended?' · FINAL':''):(g.ended?'FINAL':'EN VIVO'); liveEl.className=g.ended?'live off':'live';

    var pb=Math.round(g.pBlue*100), pr=100-pb, lead=pb>=50;
    var reasons=(g.reasons||[]).map(function(x){ var b=x.z>=0; return '<li><span class="dot '+(b?'b':'r')+'"></span><span>'+esc(x.txt)+'</span><span class="w">'+(b?m.blue.code:m.red.code)+'</span></li>'; }).join('') || '<li class="empty" style="padding:10px 0">Calculando factores…</li>';

    var tms='';
    if (g.timers){
      var items=[];
      if (g.timers.dragon && g.timers.dragon.at>g.gt) items.push(['<b>'+(g.timers.dragon.elder?'Ancestral':'Dragón')+'</b>',mmss(g.timers.dragon.at-g.gt)]);
      if (g.timers.baron && g.timers.baron.at>g.gt) items.push(['Barón',mmss(g.timers.baron.at-g.gt)]);
      items.unshift(['Tiempo',mmss(g.gt)]);
      tms=items.map(function(a){ return '<div class="tm"><div class="v">'+a[1]+'</div><div class="k">'+a[0].replace(/<[^>]+>/g,'')+'</div></div>'; }).join('');
    }
    var evs=(g.events||[]).slice().reverse().map(function(e){ return '<li><span class="t">'+mmss(e.gt)+'</span>'+esc(e.txt)+'</li>'; }).join('') || '<li style="color:var(--muted)">Sin eventos aún.</li>';

    if (CMP){  // modo compacto: solo lo esencial para comentar en vivo
      var k=g.keyPlayer, im=g.impact;
      content.innerHTML='<div class="grid">'+
        '<div class="card"><div class="sc"><span class="tc b">'+esc(m.blue.code)+'</span><span class="vs">'+mmss(g.gt)+'</span><span class="tc r">'+esc(m.red.code)+'</span></div>'+
          '<div class="bigp"><span class="n" data-rpn="bigp" style="color:'+(lead?RPC.atxt:RPC.btxt)+'">'+(lead?pb:pr)+'%</span><span class="who">a favor de '+esc(lead?m.blue.code:m.red.code)+'</span></div>'+
          '<div class="pbar"><div class="pb" style="width:'+Math.min(85,Math.max(pb,15))+'%">'+pb+'%</div><div class="pr" style="width:'+Math.min(85,Math.max(pr,15))+'%">'+pr+'%</div></div>'+
          '<ul class="rz" style="margin-top:12px">'+(g.reasons||[]).slice(0,3).map(function(x){ var b=x.z>=0; return '<li><span class="dot '+(b?'b':'r')+'"></span><span>'+esc(x.txt)+'</span><span class="w">'+(b?m.blue.code:m.red.code)+'</span></li>'; }).join('')+'</ul></div>'+
        '<div class="card"><h2>Ahora</h2><div class="tms">'+tms+'</div>'+
          (im?'<div class="delta" style="margin-top:10px">Próx. '+esc(im.obj)+': si lo toma <b class="b">'+esc(m.blue.code)+'</b> '+(im.blue>=0?'+':'')+im.blue+' pts · <b class="r">'+esc(m.red.code)+'</b> '+(im.red>=0?'+':'')+im.red+' pts</div>':'')+
          (k?'<div class="delta" style="margin-top:8px">⭐ Jugador clave: <b>'+esc(k.name)+'</b> ('+esc(k.code)+', '+esc(k.champ)+') · '+Math.round(k.share*100)+'% del daño</div>':'')+'</div>'+
        '<div class="card"><h2>Qué mirar ahora</h2>'+mirarCard(s)+'</div>'+
        '<div class="card"><h2>Qué cambió en el último minuto</h2>'+cambioCard(s)+'</div>'+
        '<div class="card wide"><h2>La historia del juego</h2>'+historiaCard(s)+'</div>'+
        '<div class="card talk"><h2>Para comentar</h2>'+talkingPoints(s,5)+'</div>'+
      '</div>';
      return;
    }
    content.innerHTML =
      '<div class="grid">'+(g.recap?recapCard(s):'')+
        '<div class="card wide"><h2>La historia del juego</h2>'+historiaCard(s)+'</div>'+
        '<div class="card">'+
          '<div class="sc"><span class="tc b">'+esc(m.blue.code)+'</span><span class="vs">'+(m.blue.wins==null?'vs':m.blue.wins+' – '+m.red.wins)+'</span><span class="tc r">'+esc(m.red.code)+'</span></div>'+
          '<h2>Probabilidad en vivo</h2>'+
          '<div class="bigp"><span class="n" data-rpn="bigp" style="color:'+(lead?RPC.atxt:RPC.btxt)+'">'+(lead?pb:pr)+'%</span><span class="who">a favor de '+esc(lead?m.blue.code:m.red.code)+'</span></div>'+
          '<div class="pbar"><div class="pb" style="width:'+Math.min(85,Math.max(pb,15))+'%">'+esc(m.blue.code)+' '+pb+'%</div><div class="pr" style="width:'+Math.min(85,Math.max(pr,15))+'%">'+pr+'% '+esc(m.red.code)+'</div></div>'+
          '<div class="delta">Minuto '+mmss(g.gt)+' · el modelo se actualiza con oro, torres, dragones, almas, Barón e inhibidores.</div>'+
        '</div>'+
        '<div class="card"><h2>Por qué</h2><ul class="rz">'+reasons+'</ul></div>'+
        '<div class="card"><h2>Qué cambió en el último minuto</h2>'+cambioCard(s)+'</div>'+
        '<div class="card"><h2>Qué mirar ahora</h2>'+mirarCard(s)+'</div>'+
        '<div class="card"><h2>Momentum y giros clave</h2>'+sparkline(g.samples||[],g.swings)+'<div class="spk-note">Probabilidad de '+esc(m.blue.code)+' (arriba) frente a '+esc(m.red.code)+' (abajo) en todo el juego. Sombreado: giros clave. La banda clara: cuánta confianza darle en cada minuto (más ancha cuando el modelo acierta menos).</div>'+swingList(g.swings)+'</div>'+
        '<div class="card"><h2>Objetivos y eventos</h2><div class="tms">'+tms+'</div><ul class="ev">'+evs+'</ul></div>'+
        '<div class="card talk"><h2>Puntos para comentar</h2>'+talkingPoints(s)+'</div>'+
        '<div class="card wide"><h2>Mapa de la Grieta</h2>'+riftCard(s)+'</div>'+
        '<div class="card wide"><h2>Oro y objetivos</h2>'+goldChart(s)+'</div>'+
        '<div class="card"><h2>Kills en el tiempo</h2>'+killsChart(s)+'</div>'+
        '<div class="card"><h2>Rendimiento por jugador</h2>'+perfCard(s)+'</div>'+
        '<div class="card"><h2>Niveles, visión e ítems</h2>'+jugCard(s)+'</div>'+
        '<div class="card"><h2>Duelos por línea</h2>'+lanesCard(s)+'</div>'+
        '<div class="card"><h2>Serie</h2>'+seriesCard(s)+'</div>'+
        '<div class="card"><h2>Draft y ventana de poder</h2>'+draftCard(s)+'</div>'+
        '<div class="card"><h2>Para remontar</h2>'+comebackCard(s)+'</div>'+
        '<div class="card wide"><h2>Alineaciones de la serie</h2>'+mapsCard(s)+'</div>'+
      '</div>';
  }

  if (!R){ content.innerHTML='<div class="card"><div class="empty">No cargó el motor (engine.js).</div></div>'; return; }
  var LAST=null;
  var cmpb=document.getElementById('cmpb'); cmpb.classList.toggle('on',CMP);
  cmpb.addEventListener('click',function(){ CMP=!CMP; cmpb.classList.toggle('on',CMP); try{ localStorage.setItem('rp_mesa_cmp',CMP?'1':'0'); }catch(e){} if (LAST) render(LAST); });
  content.addEventListener('click',function(e){
    var cp=e.target.closest('[data-cp]'); if (cp){ var t=TALK[+cp.getAttribute('data-cp')]; if (t){ var i=+cp.getAttribute('data-cp'), fin=function(){ COPIADO=i; if (LAST) render(LAST); setTimeout(function(){ COPIADO=null; if (LAST) render(LAST); },1500); }; navigator.clipboard.writeText(t.text).then(fin,fin); } return; }
    var pt=e.target.closest('[data-pt]'); if (pt){ RSEL=pt.getAttribute('data-pt'); if (LAST) render(LAST); return; }
    var b=e.target.closest('[data-act="png"]'); if (!b || !LAST || !LAST.game || !LAST.game.recap) return;
    var a=document.createElement('a'); a.href=recapPNG(LAST); a.download='riftpulse-'+LAST.game.recap.code+'-juego'+(LAST.match.gameNo||'')+'.png'; a.click();
  });
  R.onUpdate(function(s){ LAST=s; render(s); if (window.RPUI) RPUI.numeros(content); });
  R.auto();
})();
</script>
</body>
</html>
