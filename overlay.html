<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiftPulse Overlay</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="rp-tokens.css">
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:var(--ff);color:var(--text)}
</style>
</head>
<body>
<script>
  // OBS guarda la página en caché: los scripts llevan la hora en la dirección, así cada hora se toma la última versión sin hacer nada
  (function () {
    var v = Math.floor(Date.now() / 36e5);
    ['rp-i18n.js', 'engine.js', 'rp-ui.js', 'obs.js', 'votacion.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
    // la demo abierta en una pestaña (no en OBS ni dentro de otra página) se ve sobre un fondo oscuro, como sobre un stream
    if (/[?&]demo\b/.test(location.search) && !window.obsstudio && window.top === window) document.body.style.background = 'radial-gradient(1200px 700px at 30% 20%,#1b2433,#0C0E12)';
  })();
</script>
</body>
</html>
