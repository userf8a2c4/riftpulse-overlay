# Sondeo con datos reales del feed de lolesports. Solo imprime un informe en el registro; no cambia nada.
# A mano: revisa juegos ya jugados. Programado: durante los partidos en vivo, mide la frescura del feed y qué muestra el motor.
name: Sondeo del feed real

on:
  workflow_dispatch:
  schedule:
    - cron: '35 20-23 30 10 *'   # TLAW vs LOS y G2 vs HLE, 30/10 (UTC)
    - cron: '5,25,45 17-23 31 10 *'   # Sistema Suizo, 31/10 (UTC): cada 20 min (GitHub saltea o atrasa corridas programadas)
    - cron: '5,25,45 22-23 3-8 11 *'  # cuartos (3–6/11) y semifinales (7–8/11), desde las 22:00 UTC
    - cron: '5,25,45 0-2 4-9 11 *'    # … y su continuación después de medianoche (UTC)
    - cron: '5,25,45 19-23 14 11 *'   # la final, 14/11 desde las 19:00 UTC

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node pruebas/sondeo.js
        env:
          SOLO_VIVO: ${{ github.event_name == 'schedule' }}
