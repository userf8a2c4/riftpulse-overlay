# Sondeo con datos reales del feed de lolesports (se lanza a mano). Solo imprime un informe en el registro; no cambia nada.
name: Sondeo del feed real

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node pruebas/sondeo.js
