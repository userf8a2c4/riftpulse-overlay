# Calidad en cada cambio: el linter (sin errores ni avisos) y las 14 baterías de pruebas de punta a punta
# (sincronía con el video, feed caído, extensión real, legibilidad, director, app…). Si algo se rompe, se ve acá.
name: Pruebas

on:
  push:
    branches: [main]
    paths-ignore: ['wiki/**', 'docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Herramientas
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          pip install pillow
          npm i --no-save eslint@8.57.0 playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Linter
        run: npx eslint --no-eslintrc -c .eslintrc.json --max-warnings 0 engine.js obs.js votacion.js rp-ui.js rp-i18n.js sw.js ext-overlay.js app.js fuente/*.js pruebas/*.js modelo/*.js
      - name: Lo publicado está armado con el código de fuente/
        run: |
          python3 fuente/construir_extension.py
          git diff --exit-code -- app.html ext-overlay.js README.md || { echo "::error::app.html, ext-overlay.js o el badge del README no coinciden con fuente/: corré python3 fuente/construir_extension.py y subí el resultado"; exit 1; }
          V=$(grep -oP "VERSION, VERSION_NOMBRE = '\K[^']+" fuente/construir_extension.py)
          for z in descargas/riftpulse-extension.zip descargas/riftpulse-extension-tienda.zip; do unzip -p "$z" '*manifest.json' | grep -q "\"version\": \"$V\"" || { echo "::error::$z no tiene la versión $V: corré el build y subí los ZIP"; exit 1; }; done
      - name: Pruebas
        run: xvfb-run -a node pruebas/todas.js
