# Publica la carpeta wiki/ en la wiki de GitHub cada vez que cambia en main.
name: Publicar wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar wiki/ a la wiki de GitHub
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "userf8a2c4"
          git config user.email "node77e1@yahoo.com"
          git add -A
          if git diff --cached --quiet; then echo "La wiki ya está al día."; exit 0; fi
          git commit -m "Wiki actualizada desde wiki/ (${GITHUB_SHA::7})"
          git push
