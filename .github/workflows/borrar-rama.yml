name: Borrar rama temporal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar cz/exciting-maxwell-gfseig
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete cz/exciting-maxwell-gfseig
