<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RiftPulse">
  <defs>
    <linearGradient id="rpBR" x1="8" y1="40" x2="56" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset=".48" stop-color="#9ab0e6"/>
      <stop offset="1" stop-color="#ff5a5f"/>
    </linearGradient>
    <linearGradient id="rpBG" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18223c"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <filter id="rpGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- placa HUD -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#rpBG)" stroke="#2b3c62" stroke-width="1.5"/>
  <!-- tinte diagonal por equipos -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#rpBR)" opacity=".12"/>
  <!-- línea base tenue -->
  <path d="M10 35 H54" fill="none" stroke="#2b3c62" stroke-width="1.5" stroke-linecap="round"/>
  <!-- pulso de probabilidad -->
  <path d="M10 35 H21 L25 35 L30 17 L36 49 L40 35 H54"
        fill="none" stroke="url(#rpBR)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#rpGlow)"/>
  <!-- nodo del pico -->
  <circle cx="30" cy="17" r="3.1" fill="#ffffff" filter="url(#rpGlow)"/>
</svg>
